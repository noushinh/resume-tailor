[project]
name = "resume-tailor-backend"
version = "0.1.0"
description = "FastAPI backend for Resume Tailor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "google-genai>=1.14.0",
    "python-dotenv>=1.0.0",
    "pyopenssl>=24.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
